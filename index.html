<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kinsley's Personal Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --mauve: #c9a9a6;
      --mauve-deep: #a67c7a;
      --mauve-light: #e8d5d3;
      --satin: #d4b8b5;
      --cream: #f8f1ef;
      --ink: #2c2423;
      --soft-ink: #5c4a48;
      --gold: #c9b896;
      --seal: #8b3a3a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      background: #1a1413;
      color: var(--cream);
    }

    /* ========== OPENING CARD ========== */
    #opening {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #3d2c2b 0%, #1a1413 70%);
      transition: opacity 1.2s ease, visibility 1.2s;
    }

    #opening.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card-wrapper {
      position: relative;
      width: min(340px, 86vw);
      height: min(520px, 78vh);
      perspective: 1600px;
      cursor: pointer;
    }

    .invitation-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.4s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .card-front {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #e8d5d3 0%, #d4b8b5 40%, #c9a9a6 100%);
      border-radius: 4px;
      box-shadow: 
        0 25px 50px -12px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      backface-visibility: hidden;
    }

    .card-front::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M60 20c-8 15-25 25-25 40 0 15 12 25 25 25s25-10 25-25c0-15-17-25-25-40z' fill='none' stroke='%23b89a97' stroke-width='1.2' opacity='0.35'/%3E%3Cpath d='M60 30c-6 12-18 18-18 30 0 12 9 18 18 18s18-6 18-18c0-12-12-18-18-30z' fill='none' stroke='%23b89a97' stroke-width='0.8' opacity='0.25'/%3E%3C/svg%3E");
      background-size: 110px 110px;
      opacity: 0.7;
      pointer-events: none;
    }

    .card-front::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        125deg,
        transparent 30%,
        rgba(255,255,255,0.15) 45%,
        rgba(255,255,255,0.05) 50%,
        transparent 70%
      );
      animation: sheen 8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes sheen {
      0%, 100% { transform: translateX(-30%) translateY(-30%) rotate(0deg); }
      50% { transform: translateX(30%) translateY(30%) rotate(5deg); }
    }

    .wax-seal {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #a84a4a, #6b2a2a 70%, #4a1c1c);
      box-shadow: 
        0 8px 20px rgba(0,0,0,0.4),
        inset 0 2px 4px rgba(255,255,255,0.15),
        inset 0 -3px 6px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
      transition: transform 0.4s ease, box-shadow 0.4s;
    }

    .wax-seal:hover {
      transform: scale(1.06);
      box-shadow: 
        0 12px 28px rgba(0,0,0,0.5),
        inset 0 2px 4px rgba(255,255,255,0.2);
    }

    .wax-seal .monogram {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 600;
      color: #f0d8a8;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
      letter-spacing: 1px;
    }

    .wax-seal .ring {
      position: absolute;
      inset: 6px;
      border: 1.5px solid rgba(240, 216, 168, 0.35);
      border-radius: 50%;
    }

    .ribbon {
      position: absolute;
      bottom: 28%;
      width: 160px;
      height: 40px;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ribbon-bow {
      position: relative;
      width: 70px;
      height: 36px;
    }

    .ribbon-bow::before,
    .ribbon-bow::after {
      content: '';
      position: absolute;
      width: 38px;
      height: 28px;
      background: linear-gradient(135deg, #c9a9a6, #a67c7a);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      top: 0;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }

    .ribbon-bow::before { left: 0; transform: rotate(-25deg); }
    .ribbon-bow::after { right: 0; transform: rotate(25deg); }

    .ribbon-knot {
      position: absolute;
      width: 22px;
      height: 18px;
      background: linear-gradient(160deg, #b8928f, #8f6866);
      border-radius: 4px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .ribbon-tails {
      position: absolute;
      width: 100%;
      height: 50px;
      top: 22px;
      left: 0;
    }

    .ribbon-tails span {
      position: absolute;
      width: 28px;
      height: 45px;
      background: linear-gradient(180deg, #c9a9a6, #a67c7a);
      clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .ribbon-tails span:first-child {
      left: 18px;
      transform: rotate(-12deg);
    }

    .ribbon-tails span:last-child {
      right: 18px;
      transform: rotate(12deg);
    }

    .hint-text {
      position: absolute;
      bottom: 12%;
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      letter-spacing: 3px;
      color: var(--soft-ink);
      opacity: 0.7;
      text-transform: uppercase;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }

    #opening.opening .invitation-card {
      transform: rotateX(-12deg) scale(0.96);
    }

    #opening.opening .wax-seal {
      transform: scale(0.3) translateY(-80px);
      opacity: 0;
      transition: all 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #opening.opening .ribbon {
      transform: scale(1.4) translateY(40px);
      opacity: 0;
      transition: all 0.8s ease 0.15s;
    }

    #opening.opening .card-front {
      transform: scale(1.05);
      filter: brightness(1.1);
      transition: all 1s ease;
    }

    /* ========== MAIN CONTENT ========== */
    #main {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.1s ease 0.3s, visibility 1.1s;
      background: 
        radial-gradient(ellipse at 50% 0%, #3a2a28 0%, transparent 55%),
        linear-gradient(180deg, #1f1817 0%, #151110 100%);
      overflow-y: auto;
      overflow-x: hidden;
    }

    #main.visible {
      opacity: 1;
      visibility: visible;
    }

    .header {
      padding: 48px 24px 20px;
      text-align: center;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 500;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      letter-spacing: 6px;
      color: var(--cream);
      text-transform: uppercase;
    }

    .header .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      letter-spacing: 4px;
      color: var(--mauve);
      margin-top: 8px;
      opacity: 0.8;
    }

    .timers {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      padding: 20px 24px 40px;
    }

    .timer-block {
      text-align: center;
      width: min(360px, 92vw);
    }

    .timer-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--mauve);
      margin-bottom: 14px;
      opacity: 0.9;
    }

    .timer-display {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .time-unit {
      background: linear-gradient(145deg, rgba(201,169,166,0.12), rgba(166,124,122,0.08));
      border: 1px solid rgba(201,169,166,0.18);
      border-radius: 12px;
      padding: 14px 10px;
      min-width: 68px;
      backdrop-filter: blur(8px);
    }

    .time-unit .num {
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      font-weight: 500;
      color: var(--cream);
      line-height: 1.1;
    }

    .time-unit .unit {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--mauve);
      margin-top: 4px;
      opacity: 0.75;
    }

    .lived-extra {
      margin-top: 10px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      color: var(--soft-ink);
      letter-spacing: 1px;
    }

    .player-section {
      padding: 0 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .player-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--mauve);
      opacity: 0.85;
    }

    .player {
      width: min(340px, 90vw);
      background: linear-gradient(145deg, rgba(201,169,166,0.1), rgba(40,30,28,0.6));
      border: 1px solid rgba(201,169,166,0.15);
      border-radius: 20px;
      padding: 18px 20px;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .play-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, var(--mauve), var(--mauve-deep));
      color: #1a1413;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(166,124,122,0.35);
    }

    .play-btn:hover {
      transform: scale(1.06);
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-title {
      font-family: 'Playfair Display', serif;
      font-size: 15px;
      color: var(--cream);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 12px;
      color: var(--mauve);
      margin-top: 2px;
      opacity: 0.8;
    }

    .progress-wrap {
      margin-top: 8px;
      height: 3px;
      background: rgba(201,169,166,0.2);
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--mauve), var(--gold));
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--mauve), transparent);
      margin: 0 auto 8px;
      opacity: 0.5;
    }

    @media (max-height: 700px) {
      .header { padding-top: 32px; }
      .timers { gap: 24px; padding-bottom: 24px; }
      .time-unit { min-width: 58px; padding: 10px 8px; }
      .time-unit .num { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <!-- OPENING EXPERIENCE -->
  <div id="opening">
    <div class="card-wrapper" id="cardTrigger">
      <div class="invitation-card">
        <div class="card-front">
          <div class="wax-seal">
            <div class="ring"></div>
            <span class="monogram">K</span>
          </div>
          <div class="ribbon">
            <div class="ribbon-bow">
              <div class="ribbon-knot"></div>
              <div class="ribbon-tails">
                <span></span>
                <span></span>
              </div>
            </div>
          </div>
          <div class="hint-text">Pull the ribbon</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN PERSONAL SPACE -->
  <div id="main">
    <header class="header">
      <h1>Kinsley's Personal Space</h1>
      <p class="subtitle">a quiet corner of the internet</p>
    </header>

    <div class="timers">
      <!-- Next Birthday -->
      <div class="timer-block">
        <div class="timer-label">Until Next Birthday</div>
        <div class="timer-display" id="birthdayTimer">
          <div class="time-unit"><div class="num" id="b-days">--</div><div class="unit">Days</div></div>
          <div class="time-unit"><div class="num" id="b-hours">--</div><div class="unit">Hours</div></div>
          <div class="time-unit"><div class="num" id="b-mins">--</div><div class="unit">Mins</div></div>
          <div class="time-unit"><div class="num" id="b-secs">--</div><div class="unit">Secs</div></div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Time Lived -->
      <div class="timer-block">
        <div class="timer-label">Time Already Lived</div>
        <div class="timer-display" id="livedTimer">
          <div class="time-unit"><div class="num" id="l-years">--</div><div class="unit">Years</div></div>
          <div class="time-unit"><div class="num" id="l-days">--</div><div class="unit">Days</div></div>
          <div class="time-unit"><div class="num" id="l-hours">--</div><div class="unit">Hours</div></div>
          <div class="time-unit"><div class="num" id="l-mins">--</div><div class="unit">Mins</div></div>
        </div>
        <div class="lived-extra" id="livedExtra"></div>
      </div>
    </div>

    <!-- Music Player -->
    <div class="player-section">
      <div class="player-label">kinsley'choice</div>
      <div class="player">
        <button class="play-btn" id="playBtn" aria-label="Play">▶</button>
        <div class="track-info">
          <div class="track-title" id="trackTitle">Add your first track</div>
          <div class="track-artist" id="trackArtist">Your personal playlist</div>
          <div class="progress-wrap" id="progressWrap">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script>
    const BIRTH_DATE = new Date(2002, 11, 22); // Dec 22, 2002

    const opening = document.getElementById('opening');
    const main = document.getElementById('main');
    const cardTrigger = document.getElementById('cardTrigger');

    let hasOpened = false;

    function openCard() {
      if (hasOpened) return;
      hasOpened = true;

      opening.classList.add('opening');

      setTimeout(() => {
        opening.classList.add('hidden');
        main.classList.add('visible');
        updateTimers();
        setInterval(updateTimers, 1000);
      }, 1100);
    }

    cardTrigger.addEventListener('click', openCard);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') openCard();
    });

    function pad(n) {
      return n.toString().padStart(2, '0');
    }

    function getNextBirthday() {
      const now = new Date();
      let next = new Date(now.getFullYear(), 11, 22);
      if (now > next) {
        next = new Date(now.getFullYear() + 1, 11, 22);
      }
      return next;
    }

    function updateTimers() {
      const now = new Date();

      // Next Birthday
      const nextBday = getNextBirthday();
      const diffBday = nextBday - now;

      if (diffBday <= 0) {
        document.getElementById('b-days').textContent = '0';
        document.getElementById('b-hours').textContent = '0';
        document.getElementById('b-mins').textContent = '0';
        document.getElementById('b-secs').textContent = '0';
      } else {
        const days = Math.floor(diffBday / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diffBday % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diffBday % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diffBday % (1000 * 60)) / 1000);

        document.getElementById('b-days').textContent = days;
        document.getElementById('b-hours').textContent = pad(hours);
        document.getElementById('b-mins').textContent = pad(mins);
        document.getElementById('b-secs').textContent = pad(secs);
      }

      // Time Lived
      const livedMs = now - BIRTH_DATE;
      const livedSec = Math.floor(livedMs / 1000);
      const livedMin = Math.floor(livedSec / 60);
      const livedHour = Math.floor(livedMin / 60);
      const livedDay = Math.floor(livedHour / 24);

      let years = now.getFullYear() - BIRTH_DATE.getFullYear();
      const m = now.getMonth() - BIRTH_DATE.getMonth();
      if (m < 0 || (m === 0 && now.getDate() < BIRTH_DATE.getDate())) {
        years--;
      }

      const totalDays = Math.floor(livedMs / (1000 * 60 * 60 * 24));
      const yearsExact = Math.floor(totalDays / 365.25);
      const daysAfterYears = totalDays - Math.floor(yearsExact * 365.25);
      const hours = livedHour % 24;
      const mins = livedMin % 60;

      document.getElementById('l-years').textContent = years;
      document.getElementById('l-days').textContent = daysAfterYears;
      document.getElementById('l-hours').textContent = pad(hours);
      document.getElementById('l-mins').textContent = pad(mins);

      document.getElementById('livedExtra').textContent = 
        `${totalDays.toLocaleString()} days · ${livedHour.toLocaleString()} hours lived`;
    }

    // Music Player
    const playlist = []; // 之后在这里添加歌曲

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const progressBar = document.getElementById('progressBar');
    const progressWrap = document.getElementById('progressWrap');

    let currentIndex = 0;
    let isPlaying = false;

    function loadTrack(index) {
      if (playlist.length === 0) {
        trackTitle.textContent = "Add your first track";
        trackArtist.textContent = "Your personal playlist";
        return;
      }
      const track = playlist[index];
      audio.src = track.src;
      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist;
    }

    playBtn.addEventListener('click', () => {
      if (playlist.length === 0) {
        alert("歌单目前是空的。\n之后你可以在代码里的 playlist 数组中添加歌曲。");
        return;
      }
      if (isPlaying) {
        audio.pause();
        playBtn.textContent = '▶';
      } else {
        audio.play();
        playBtn.textContent = '❚❚';
      }
      isPlaying = !isPlaying;
    });

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = pct + '%';
      }
    });

    audio.addEventListener('ended', () => {
      currentIndex = (currentIndex + 1) % playlist.length;
      loadTrack(currentIndex);
      if (isPlaying) audio.play();
    });

    progressWrap.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressWrap.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    loadTrack(0);
  </script>
</body>
</html>
