<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kinsleykong - Home</title>
    <!-- 引入 Google Fonts 提升排版质感 -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- 引入 FontAwesome 图标库用于音乐播放器图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            color: #222222;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- 开场动画层 --- */
        #intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease-in-out;
        }

        .video-wrapper {
            position: relative;
            width: 500px;
            height: 500px;
            max-width: 90vw;
            max-height: 90vh;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        /* 放大并裁剪视频，完美去掉右侧点赞按钮，同时保持画面和谐 */
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: -15%; /* 向左微调裁剪右侧多余的点赞按钮区域 */
            width: 130%; /* 放大视频宽度以掩盖裁切痕迹 */
            height: 100%;
            object-fit: cover;
        }

        /* 引导点击提示（防止浏览器自动播放音频策略拦截，点击任意处可激活声音并播放视频） */
        #click-to-start {
            position: absolute;
            bottom: 30px;
            font-size: 14px;
            color: #777777;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
            cursor: pointer;
            z-index: 101;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* --- 主界面层 --- */
        #main-container {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.2s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
        }

        #main-container.show {
            opacity: 1;
            visibility: visible;
        }

        .profile-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #111;
        }

        .profile-content p {
            font-size: 1rem;
            color: #666;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* 优雅的音乐播放器设计 */
        .music-player {
            background: #fafafa;
            border: 1px solid #eaeaea;
            padding: 20px 30px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            width: 320px;
        }

        .play-btn {
            background: #111;
            color: #fff;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.05);
        }

        .track-info {
            text-align: left;
            flex-grow: 1;
            overflow: hidden;
        }

        .track-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: #222;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <!-- 开场动画容器 -->
    <div id="intro-container">
        <div class="video-wrapper">
            <!-- 引入你的视频文件，保留声音 -->
            <video id="intro-video" src="video_1.mp4" playsinline></video>
        </div>
        <div id="click-to-start">Click anywhere to enter</div>
    </div>

    <!-- 主界面容器 -->
    <div id="main-container">
        <div class="profile-content">
            <h1>kinsleykong</h1>
            <p>Welcome to my space</p>
            
            <!-- 音乐播放器 -->
            <div class="music-player">
                <button class="play-btn" id="playAudioBtn">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                </button>
                <div class="track-info">
                    <div class="track-title">Ambient Memories</div>
                    <div class="track-artist">kinsleykong selection</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 背景音乐音频源（可自行替换为你的音乐链接或本地音乐文件） -->
    <audio id="bgm" src="https://www.bensound.com/bensound-music/bensound-thejazzpiano.mp3" preload="auto" loop></audio>

    <script>
        const introContainer = document.getElementById('intro-container');
        const mainContainer = document.getElementById('main-container');
        const video = document.getElementById('intro-video');
        const clickPrompt = document.getElementById('click-to-start');
        
        const bgm = document.getElementById('bgm');
        const playAudioBtn = document.getElementById('playAudioBtn');
        const playIcon = document.getElementById('playIcon');

        let isStarted = false;

        // 用户点击任意地方以启动视频和声音（解决现代浏览器对自动播放音频的限制）
        function startExperience() {
            if (isStarted) return;
            isStarted = true;
            clickPrompt.style.display = 'none';

            video.muted = false; // 确保声音开启
            video.play().catch(error => {
                console.log("Playback prevented:", error);
            });
        }

        window.addEventListener('click', startExperience);

        // 视频播放结束后的自动跳转逻辑
        video.addEventListener('ended', () => {
            // 1. 开场动画层淡出
            introContainer.style.opacity = '0';
            setTimeout(() => {
                introContainer.style.display = 'none';
                // 2. 显示主界面
                mainContainer.classList.add('show');
                
                // 3. 可选：视频结束后自动无缝衔接播放背景音乐
                bgm.play().then(() => {
                    playIcon.className = "fa-solid fa-pause";
                }).catch(e => console.log("BGM autoplay blocked"));
            }, 1000); // 1秒过渡时间与 CSS 保持一致
        });

        // 音乐播放器控制按钮交互
        playAudioBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // 阻止触发全局点击
            if (bgm.paused) {
                bgm.play();
                playIcon.className = "fa-solid fa-pause";
            } else {
                bgm.pause();
                playIcon.className = "fa-solid fa-play";
            }
        });
    </script>
</body>
</html>
